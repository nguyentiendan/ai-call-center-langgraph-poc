[project]
name = "ai-call-center-poc"
version = "0.1.0"
description = "YAML-driven LangGraph call center PoC (text-first, telecom billing)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint>=2,<4",
]

[project.optional-dependencies]
llm = ["openai>=1.30,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
